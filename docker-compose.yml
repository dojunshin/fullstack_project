name: dojun_project_app

services:
  # ── MySQL ─────────────────────────────────────────────────
  mysql:
    container_name: dojun_db_mysql
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-test}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API Server ────────────────────────────────────
  server:
    build:
      context: https://github.com/dojunshin/fullstack_project.git#main:server
    container_name: dojun_server
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-test}
      CLIENT_ORIGIN: http://localhost
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"

  # ── React Client (nginx) ──────────────────────────────────
  client:
    build:
      context: https://github.com/dojunshin/fullstack_project.git#main:client
      args:
        VITE_API_BASE_URL: ""   # nginx가 /api/* 를 server:4000 으로 프록시
    container_name: dojun_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
