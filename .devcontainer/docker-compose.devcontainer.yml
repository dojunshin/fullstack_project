# devcontainer 전용 독립 compose
# mysql + workspace 만 실행 (server/client 컨테이너 불필요)
name: dojun_project_app

services:
  mysql:
    container_name: dojun_db_mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-test}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace:
    container_name: dojun_project
    image: node:20-alpine
    working_dir: /workspace
    environment:
      DB_HOST: mysql
      CLIENT_ORIGIN: http://localhost:3000
    volumes:
      - ..:/workspace
    command: sleep infinity   # VS Code가 연결을 유지하는 동안 대기
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
